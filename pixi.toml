# Development workspace of rebox, and definition of its conda package.
#
#   pixi run rebox ...          run rebox from the sources
#   pixi run test               run the tests
#   pixi run build-package      build the conda package into dist/
#
# Package metadata (name, version, description, entry point) comes from
# pyproject.toml; the conda run-dependencies are declared below.

[workspace]
name = "rebox"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
python = ">=3.11"
apptainer = ">=1.3"
squashfs-tools = "*"
tomli-w = ">=1.0"
pixi-pack = ">=0.7"
git = "*"

[tasks]
rebox = { cmd = "python -m rebox", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }
build-package = { cmd = "pixi build --output-dir dist", description = "Build the rebox conda package into dist/" }

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = "python -m pytest -q"

[environments]
test = ["test"]

# --------------------------------------------------------------------------- #
# Conda package
# --------------------------------------------------------------------------- #
[package]
name = "rebox"
version = "0.3.0"  # keep in sync with pyproject.toml

[package.build.backend]
name = "pixi-build-python"
version = "0.8.*"
channels = ["conda-forge"]

[package.build.config]
noarch = true

[package.host-dependencies]
hatchling = "*"

[package.run-dependencies]
python = ">=3.11"
tomli-w = ">=1.0"
apptainer = ">=1.3"
squashfs-tools = "*"
git = "*"
pixi-pack = ">=0.7"
