[workspace]
name = "rebox"
description = "Rootless sandbox environments built from reusable recipes, Apptainer and Pixi"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = ">=3.11"
apptainer = ">=1.3"
squashfs-tools = "*"
tomli-w = ">=1.0"
pixi-pack = ">=0.7"
git = "*"

[tasks]
rebox = { cmd = "python -m rebox", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = { cmd = "python -m pytest -q tests", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }

[environments]
test = ["test"]
