description = "VS Code editing one project, with extensions from the marketplace only"

[build]
# Use "vscodium" instead for the build without Microsoft telemetry (Open VSX extensions).
recipes = ["vscode"]

[resources]
network = "allowlist"
cpus = 4
memory = "8G"
pids = 4096
# Display access (X11 / Wayland sockets of your session). WARNING: any program
# allowed to use your display can read keystrokes and take screenshots of your
# other windows. Do not give a display to untrusted software.
display = true

[resources.allow.vscode-marketplace]
enabled = true

[resources.binds.project]
source = "~/code/my-project"
target = "/work"
mode = "rw"
optional = true
